name: Swift bridge
# Runs on the promotion to main and on main only; next is gated by real verification.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Select pinned installed Xcode
        working-directory: .
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = 'Xcode 26.6'
      - uses: actions/checkout@v4
        with:
          path: ios
      - id: contract
        name: Read immutable SDK pin
        run: python3 -c 'import json; print("commit=" + json.load(open("docs/sdk-contract.json"))["sourceCommit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ramfluxhq/ramflux
          ref: ${{ steps.contract.outputs.commit }}
          path: sdk
      - name: Verify generated contract and generator guards
        run: |
          python3 scripts/sync-sdk-contract.py ../sdk --commit '${{ steps.contract.outputs.commit }}' --check
          git diff --exit-code
          python3 -m unittest discover -s scripts/tests -v
      - name: Host compile and headless tests
        run: |
          swift build
          swift test
      - name: iOS simulator source compile
        run: xcodebuild -scheme RamfluxCore -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
