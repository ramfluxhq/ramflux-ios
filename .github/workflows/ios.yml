name: iOS
on:
  pull_request:
  push:
    branches: [main, feat/ios-ui]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Xcode
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = 'Xcode 26.2'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check complete localized UI copy
        run: |
          python3 scripts/check-ui-localization.py
          python3 scripts/export-localizations.py --check
          python3 scripts/check-zh-font-glyphs.py
      - name: Script guard tests
        run: python3 -m unittest discover -s scripts/tests
      - name: Generate project
        run: xcodegen generate
      - name: Check minimal OS permission declarations
        run: python3 scripts/check-permissions.py
      - name: Headless bridge and feature tests
        run: |
          swift test
          swift test --package-path Packages/RFLocalization
          swift test --package-path Packages/AppData
          swift test --package-path Packages/FeatureAppShell
          swift test --package-path Packages/FeatureOnboarding
          swift test --package-path Packages/FeatureConversations
          swift test --package-path Packages/FeatureChat
          swift test --package-path Packages/FeatureContacts
          swift test --package-path Packages/FeatureSettings
          swift test --package-path Packages/FeatureGroups
          swift test --package-path Packages/FeatureCalls
          swift test --package-path Packages/FeatureAgents
          swift test --package-path Packages/FeatureTasks
          swift test --package-path Packages/FeaturePermissions
          swift test --package-path Packages/FeatureCards
      - name: Build iOS Simulator application
        run: xcodebuild -project Ramflux.xcodeproj -scheme Ramflux -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
      - name: Design token tests
        run: |
          python3 scripts/check-mobile-tokens.py design-tokens/mobile-kit-tokens.json
          swift test --package-path Packages/RFDesign --skip captureKitBoards
      - name: Render every screen preview on iOS Simulator
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k,vs in d.items() if "iOS" in k for v in vs if v["isAvailable"] and "iPhone" in v["name"]))')
          xcrun simctl bootstatus "$device_id" -b
          TEST_RUNNER_SHELL_CAPTURE_DIR=/tmp/shell-ios-captures xcodebuild -project Ramflux.xcodeproj -scheme Ramflux -destination "platform=iOS Simulator,id=$device_id" -resultBundlePath build/ScreenSnapshots.xcresult test CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screen-snapshots
          path: build/ScreenSnapshots.xcresult
          if-no-files-found: warn
  kit-evidence:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Xcode
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = 'Xcode 26.2'
      - name: Check design tokens against the spec
        run: python3 scripts/check-mobile-tokens.py design-tokens/mobile-kit-tokens.json
      - name: Capture kit boards on the iOS simulator
        timeout-minutes: 20
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k,vs in d.items() if "iOS" in k for v in vs if v["isAvailable"] and "iPhone" in v["name"]))')
          xcrun simctl bootstatus "$device_id" -b
          cd Packages/RFDesign
          xcodebuild -scheme RFDesign -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath "$RUNNER_TEMP/kit-dd" test -only-testing:RFDesignTests/KitCaptureTests -only-testing:RFDesignTests/KitCoverageTests CODE_SIGNING_ALLOWED=NO
          test -n "$(find /tmp/kit-ios-captures -name '*.png' -print -quit)"
      - name: Compare captures with the design previews
        run: python3 scripts/compare-kit-previews.py kit-previews /tmp/kit-ios-captures "$GITHUB_WORKSPACE/kit-evidence-ci"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Capture shell boards on the iOS simulator
        timeout-minutes: 20
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k,vs in d.items() if "iOS" in k for v in vs if v["isAvailable"] and "iPhone" in v["name"]))')
          xcrun simctl bootstatus "$device_id" -b
          TEST_RUNNER_SHELL_CAPTURE_DIR=/tmp/shell-ios-captures xcodebuild -project Ramflux.xcodeproj -scheme Ramflux -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath "$RUNNER_TEMP/shell-dd" test -only-testing:RamfluxTests/ShellBoardCaptureTests CODE_SIGNING_ALLOWED=NO
          test -n "$(find /tmp/shell-ios-captures -name '*.png' -print -quit)"
      - name: Compare board captures with the design references
        run: |
          python3 scripts/design-references.py --check
          python3 scripts/compare-boards.py /tmp/shell-ios-captures "$GITHUB_WORKSPACE/shell-evidence-ci" --review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kit-evidence
          path: kit-evidence-ci
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-evidence
          path: shell-evidence-ci
          if-no-files-found: error
