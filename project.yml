name: Ramflux
options:
  bundleIdPrefix: org.ramflux
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    # Identifiers shared by the app and its extension; a company team or registration changes only these.
    RAMFLUX_APP_GROUP: group.$(RAMFLUX_APP_BUNDLE_ID)
    RAMFLUX_KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(RAMFLUX_APP_BUNDLE_ID).shared
  configs:
    Debug:
      RAMFLUX_APP_BUNDLE_ID: org.ramflux.ios.dev
      RAMFLUX_APNS_ENVIRONMENT: development
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) RAMFLUX_DEBUG_WAKE
    Release:
      RAMFLUX_APP_BUNDLE_ID: org.ramflux.ios
      RAMFLUX_APNS_ENVIRONMENT: production
packages:
  FeaturePermissions:
    path: Packages/FeaturePermissions
  FeatureCards:
    path: Packages/FeatureCards
  RamfluxCore:
    path: .
  FeatureTasks:
    path: Packages/FeatureTasks
  FeatureAgents:
    path: Packages/FeatureAgents
  FeatureCalls:
    path: Packages/FeatureCalls
  FeatureGroups:
    path: Packages/FeatureGroups
  FeatureAppShell:
    path: Packages/FeatureAppShell
  FeatureSettings:
    path: Packages/FeatureSettings
  FeatureContacts:
    path: Packages/FeatureContacts
  FeatureChat:
    path: Packages/FeatureChat
  FeatureConversations:
    path: Packages/FeatureConversations
  FeatureOnboarding:
    path: Packages/FeatureOnboarding
  RFDesign:
    path: Packages/RFDesign
  RFMedia:
    path: Packages/RFMedia
  AppData:
    path: Packages/AppData
  RFLocalization:
    path: Packages/RFLocalization
  Push:
    path: Packages/Push
  FeatureDelivery:
    path: Packages/FeatureDelivery
targets:
  Ramflux:
    type: application
    platform: iOS
    sources: [App]
    entitlements:
      path: App/Ramflux.entitlements
      properties:
        application-identifier: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        aps-environment: $(RAMFLUX_APNS_ENVIRONMENT)
        keychain-access-groups: [$(RAMFLUX_KEYCHAIN_GROUP)]
        com.apple.security.application-groups: [$(RAMFLUX_APP_GROUP)]
        com.apple.developer.usernotifications.time-sensitive: true
    preBuildScripts:
      - name: Require device signing team
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" = iphoneos ] && [ "$CODE_SIGNING_ALLOWED" != NO ] && [ -z "$DEVELOPMENT_TEAM" ]; then
            echo "error: Device and archive builds require RAMFLUX_DEVELOPMENT_TEAM=<Apple team ID>."
            exit 1
          fi
    postBuildScripts:
      - name: Bundle card fixtures for the Debug gallery
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/card-fixtures"
            cp -R "$SRCROOT/card-fixtures" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/card-fixtures"
          fi
    dependencies:
      - target: RamfluxNotificationService
      - package: Push
      - package: FeatureDelivery
      - package: FeaturePermissions
      - package: FeatureCards
      - package: FeatureTasks
      - package: FeatureAgents
      - package: FeatureCalls
      - package: FeatureGroups
      - package: FeatureSettings
      - package: FeatureContacts
      - package: FeatureChat
      - package: FeatureConversations
      - package: FeatureOnboarding
      - package: RFDesign
      - package: RFMedia
      - package: FeatureAppShell
      - package: AppData
      - package: RFLocalization
    settings:
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) RAMFLUX_CARD_GALLERY RAMFLUX_MLS_GALLERY
          "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
          "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
          "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": YES
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
          DEVELOPMENT_TEAM: $(RAMFLUX_DEVELOPMENT_TEAM)
          CODE_SIGN_STYLE: Automatic
        Release:
          "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
          "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
          "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": YES
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          DEVELOPMENT_TEAM: $(RAMFLUX_DEVELOPMENT_TEAM)
          CODE_SIGN_STYLE: Automatic
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RAMFLUX_APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ramflux
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.2.6'
        CURRENT_PROJECT_VERSION: '8'
        # The username directory trust pin (public configuration; empty means none, and usernames stay unavailable).
        RAMFLUX_USERNAME_DIRECTORY_URL: ''
        RAMFLUX_USERNAME_DIRECTORY_ID: ''
        RAMFLUX_USERNAME_DIRECTORY_PUBLIC_KEY: ''
        RAMFLUX_USERNAME_DIRECTORY_GENERATION: ''
    info:
      path: build/App-Info.plist
      properties:
        NSMicrophoneUsageDescription: Ramflux uses the microphone only during voice calls.
        NSCameraUsageDescription: Ramflux uses the camera only while taking a photo or scanning a QR code.
        NSPhotoLibraryAddUsageDescription: Ramflux can add images you choose to Photos, without viewing your library.
        UIBackgroundModes: [remote-notification]
        RamfluxAppGroup: $(RAMFLUX_APP_GROUP)
        RamfluxKeychainGroup: $(RAMFLUX_KEYCHAIN_GROUP)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-CN]
        RamfluxUsernameDirectoryURL: $(RAMFLUX_USERNAME_DIRECTORY_URL)
        RamfluxUsernameDirectoryID: $(RAMFLUX_USERNAME_DIRECTORY_ID)
        RamfluxUsernameDirectoryPublicKey: $(RAMFLUX_USERNAME_DIRECTORY_PUBLIC_KEY)
        RamfluxUsernameDirectoryGeneration: $(RAMFLUX_USERNAME_DIRECTORY_GENERATION)
        CFBundleURLTypes:
          - CFBundleURLName: org.ramflux.ios.navigation
            CFBundleURLSchemes: [ramflux]
  RamfluxNotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    dependencies:
      - package: Push
      - package: RamfluxCore
    entitlements:
      path: NotificationService/RamfluxNotificationService.entitlements
      properties:
        application-identifier: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        keychain-access-groups: [$(RAMFLUX_KEYCHAIN_GROUP)]
        com.apple.security.application-groups: [$(RAMFLUX_APP_GROUP)]
    settings:
      configs:
        Debug:
          "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
          "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
          "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": YES
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
          DEVELOPMENT_TEAM: $(RAMFLUX_DEVELOPMENT_TEAM)
          CODE_SIGN_STYLE: Automatic
        Release:
          "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
          "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
          "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": YES
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          DEVELOPMENT_TEAM: $(RAMFLUX_DEVELOPMENT_TEAM)
          CODE_SIGN_STYLE: Automatic
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RAMFLUX_APP_BUNDLE_ID).NotificationService
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ramflux
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.2.6'
        CURRENT_PROJECT_VERSION: '8'
    info:
      path: build/NotificationService-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-CN]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        RamfluxAppGroup: $(RAMFLUX_APP_GROUP)
        RamfluxKeychainGroup: $(RAMFLUX_KEYCHAIN_GROUP)
  RamfluxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: FeaturePermissions
      - package: FeatureCards
      - package: FeatureTasks
      - package: FeatureAgents
      - package: FeatureCalls
      - package: FeatureGroups
      - target: Ramflux
      - package: RamfluxCore
      - package: FeatureSettings
      - package: FeatureContacts
      - package: FeatureChat
      - package: FeatureConversations
      - package: FeatureOnboarding
      - package: RFDesign
      - package: FeatureAppShell
      - package: AppData
  # Opt-in end-to-end suite against a real local node (scripts/realrun.sh). It has its own scheme
  # and is never part of the Ramflux scheme, so normal CI and the default test action do not run it.
  RamfluxRealRunUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RealRunUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
        SWIFT_STRICT_CONCURRENCY: minimal
        TEST_TARGET_NAME: Ramflux
    dependencies:
      - target: Ramflux
schemes:
  Ramflux:
    build:
      targets:
        Ramflux: all
        RamfluxTests: [test]
    test:
      targets: [RamfluxTests]
  RamfluxRealRun:
    build:
      targets:
        Ramflux: all
        RamfluxRealRunUITests: [test]
    test:
      targets: [RamfluxRealRunUITests]
