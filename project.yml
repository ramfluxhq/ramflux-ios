name: Ramflux
options:
  bundleIdPrefix: org.ramflux
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  FeatureCards:
    path: Packages/FeatureCards
  RamfluxCore:
    path: .
  FeatureTasks:
    path: Packages/FeatureTasks
  FeatureAgents:
    path: Packages/FeatureAgents
  FeatureCalls:
    path: Packages/FeatureCalls
  FeatureGroups:
    path: Packages/FeatureGroups
  FeatureAppShell:
    path: Packages/FeatureAppShell
  FeatureSettings:
    path: Packages/FeatureSettings
  FeatureContacts:
    path: Packages/FeatureContacts
  FeatureChat:
    path: Packages/FeatureChat
  FeatureConversations:
    path: Packages/FeatureConversations
  FeatureOnboarding:
    path: Packages/FeatureOnboarding
  RFDesign:
    path: Packages/RFDesign
  AppData:
    path: Packages/AppData
targets:
  Ramflux:
    type: application
    platform: iOS
    sources: [App]
    entitlements:
      path: App/Ramflux.entitlements
      properties:
        application-identifier: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        keychain-access-groups: [$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)]
    preBuildScripts:
      - name: Require device signing team
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" = iphoneos ] && [ "$CODE_SIGNING_ALLOWED" != NO ] && [ -z "$DEVELOPMENT_TEAM" ]; then
            echo "error: Device and archive builds require RAMFLUX_DEVELOPMENT_TEAM=<Apple team ID>."
            exit 1
          fi
    dependencies:
      - package: FeatureCards
      - package: FeatureTasks
      - package: FeatureAgents
      - package: FeatureCalls
      - package: FeatureGroups
      - package: FeatureSettings
      - package: FeatureContacts
      - package: FeatureChat
      - package: FeatureConversations
      - package: FeatureOnboarding
      - package: RFDesign
      - package: FeatureAppShell
      - package: AppData
    settings:
      configs:
        Debug:
          "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
          "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
          "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": YES
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
          DEVELOPMENT_TEAM: $(RAMFLUX_DEVELOPMENT_TEAM)
          CODE_SIGN_STYLE: Automatic
        Release:
          "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
          "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
          "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": YES
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          DEVELOPMENT_TEAM: $(RAMFLUX_DEVELOPMENT_TEAM)
          CODE_SIGN_STYLE: Automatic
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ramflux.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ramflux
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: build/App-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-CN]
        CFBundleURLTypes:
          - CFBundleURLName: org.ramflux.ios.navigation
            CFBundleURLSchemes: [ramflux]
  RamfluxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - package: FeatureCards
      - package: FeatureTasks
      - package: FeatureAgents
      - package: FeatureCalls
      - package: FeatureGroups
      - target: Ramflux
      - package: RamfluxCore
      - package: FeatureSettings
      - package: FeatureContacts
      - package: FeatureChat
      - package: FeatureConversations
      - package: FeatureOnboarding
      - package: RFDesign
      - package: FeatureAppShell
      - package: AppData
schemes:
  Ramflux:
    build:
      targets:
        Ramflux: all
        RamfluxTests: [test]
    test:
      targets: [RamfluxTests]
