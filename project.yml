name: Ramflux
options:
  bundleIdPrefix: org.ramflux
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: NO
packages:
  FeatureTasks:
    path: Packages/FeatureTasks
  FeatureAgents:
    path: Packages/FeatureAgents
  FeatureCalls:
    path: Packages/FeatureCalls
  FeatureGroups:
    path: Packages/FeatureGroups
  FeatureAppShell:
    path: Packages/FeatureAppShell
  FeatureSettings:
    path: Packages/FeatureSettings
  FeatureContacts:
    path: Packages/FeatureContacts
  FeatureChat:
    path: Packages/FeatureChat
  FeatureConversations:
    path: Packages/FeatureConversations
  FeatureOnboarding:
    path: Packages/FeatureOnboarding
  RFDesign:
    path: Packages/RFDesign
  AppData:
    path: Packages/AppData
targets:
  Ramflux:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: FeatureTasks
      - package: FeatureAgents
      - package: FeatureCalls
      - package: FeatureGroups
      - package: FeatureSettings
      - package: FeatureContacts
      - package: FeatureChat
      - package: FeatureConversations
      - package: FeatureOnboarding
      - package: RFDesign
      - package: FeatureAppShell
      - package: AppData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ramflux.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ramflux
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: build/App-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-CN]
        CFBundleURLTypes:
          - CFBundleURLName: org.ramflux.ios.navigation
            CFBundleURLSchemes: [ramflux]
  RamfluxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - package: FeatureTasks
      - package: FeatureAgents
      - package: FeatureCalls
      - package: FeatureGroups
      - target: Ramflux
      - package: FeatureSettings
      - package: FeatureContacts
      - package: FeatureChat
      - package: FeatureConversations
      - package: FeatureOnboarding
      - package: RFDesign
      - package: FeatureAppShell
      - package: AppData
schemes:
  Ramflux:
    build:
      targets:
        Ramflux: all
        RamfluxTests: [test]
    test:
      targets: [RamfluxTests]
